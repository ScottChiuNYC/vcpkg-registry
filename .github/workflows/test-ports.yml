name: Test Ports

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-ports-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_DISABLE_METRICS: 1

jobs:
  tasmanian:
    name: Tasmanian / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            cmake_args: -G Ninja -DCMAKE_BUILD_TYPE=Release
          - name: Windows
            os: windows-2022
            cmake_args: -A x64

    steps:
      - name: Check out registry
        uses: actions/checkout@v4

      - name: Check out pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: 00807e89724847a866033a2f042c38fafae3c534
          path: vcpkg
          fetch-depth: 1
          persist-credentials: false

      - name: Bootstrap vcpkg on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Bootstrap vcpkg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Configure consumer
        run: >-
          cmake -S tests/consumer -B build/consumer
          ${{ matrix.cmake_args }}
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_OVERLAY_PORTS=${{ github.workspace }}/ports

      - name: Build consumer
        run: cmake --build build/consumer --config Release

      - name: Run consumer test
        run: ctest --test-dir build/consumer -C Release --output-on-failure
